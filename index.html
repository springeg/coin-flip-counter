<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Flip Outcome Counter</title>
<style>
	:root {
		--border: #000;
		--bg: #fff;
		--text: #000;
	}
	* {
		box-sizing: border-box;
	}
	body {
		margin: 0;
		background: var(--bg);
		color: var(--text);
		font-family: Arial, Helvetica, sans-serif;
	}
	.page {
		width: min(1000px, 94vw);
		margin: 28px auto 40px auto;
		text-align: center;
	}
	h1 {
		margin: 0 0 34px 0;
		font-size: clamp(34px, 5vw, 56px);
		font-weight: 400;
	}
	.controls {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		justify-content: center;
		gap: 18px 34px;
		margin-bottom: 24px;
	}
	.flip-button, .action-button {
		background: #fff;
		color: #000;
		border: 4px solid var(--border);
		cursor: pointer;
		font-family: inherit;
	}
	.flip-button {
		width: 112px;
		height: 112px;
		font-size: 68px;
		line-height: 1;
	}
	.action-button {
		padding: 12px 20px;
		font-size: 28px;
	}
	.flip-button:hover, .action-button:hover {
		background: #f2f2f2;
	}
	.flip-button:active, .action-button:active {
		transform: translateY(1px);
	}
	.counter-row {
		display: flex;
		flex-wrap: wrap;
		align-items: center;
		justify-content: center;
		gap: 22px;
		margin: 12px 0 22px 0;
		font-size: 34px;
	}
	.counter-label {
		text-decoration: underline;
		text-underline-offset: 4px;
	}
	.output-wrap {
		text-align: left;
	}
	#outcomes {
		width: 100%;
		height: 430px;
		resize: vertical;
		border: 4px solid var(--border);
		padding: 18px 20px;
		font-family: Arial, Helvetica, sans-serif;
		font-size: 28px;
		line-height: 1.45;
		background: #fff;
		color: #000;
	}
	.download-row {
		display: flex;
		flex-wrap: wrap;
		justify-content: flex-end;
		gap: 14px;
		margin-top: 18px;
	}
	.note {
		text-align: left;
		margin-top: 10px;
		font-size: 15px;
	}
	@media (max-width: 650px) {
		.page {
			width: 94vw;
		}
		.flip-button {
			width: 92px;
			height: 92px;
			font-size: 54px;
		}
		.action-button {
			font-size: 22px;
		}
		.counter-row {
			font-size: 28px;
		}
		#outcomes {
			height: 360px;
			font-size: 23px;
		}
	}
</style>
</head>
<body>
	<main class="page">
		<h1>Coin Flip Outcome Counter</h1>

		<div class="controls">
			<button class="flip-button" id="headsButton" type="button" aria-label="Record heads">H</button>
			<button class="flip-button" id="tailsButton" type="button" aria-label="Record tails">T</button>
		</div>

		<div class="counter-row">
			<span><span class="counter-label">Counter:</span> <span id="counter">0</span></span>
			<button class="action-button" id="resetButton" type="button">Reset</button>
		</div>

		<div class="output-wrap">
			<textarea id="outcomes" readonly aria-label="Recorded coin-flip outcomes" placeholder="Your H and T outcomes will appear here..."></textarea>
		</div>

		<div class="download-row">
			<button class="action-button" id="saveCsvButton" type="button">Save as CSV</button>
			<button class="action-button" id="saveTxtButton" type="button">Save as TXT</button>
		</div>

		<div class="note">Downloaded files contain one outcome per row, so they open as a single column in Excel.</div>
	</main>

<script>
	"use strict";

	const outcomes = [];
	const counterElement = document.getElementById("counter");
	const outcomesElement = document.getElementById("outcomes");

	function updateDisplay() {
		counterElement.textContent = outcomes.length;
		outcomesElement.value = outcomes.join(", ");
		outcomesElement.scrollTop = outcomesElement.scrollHeight;
	}

	function recordOutcome(value) {
		outcomes.push(value);
		updateDisplay();
	}

	function resetOutcomes() {
		if (outcomes.length === 0) {
			return;
		}

		const confirmed = window.confirm("Clear all recorded outcomes?");
		if (confirmed) {
			outcomes.length = 0;
			updateDisplay();
		}
	}

	function downloadFile(filename, content, mimeType) {
		if (outcomes.length === 0) {
			window.alert("No outcomes have been recorded yet.");
			return;
		}

		const blob = new Blob([content], { type: mimeType });
		const url = URL.createObjectURL(blob);
		const link = document.createElement("a");
		link.href = url;
		link.download = filename;
		document.body.appendChild(link);
		link.click();
		document.body.removeChild(link);
		URL.revokeObjectURL(url);
	}

	function saveCsv() {
		const content = "Outcome\n" + outcomes.join("\n") + "\n";
		downloadFile("coin_flip_outcomes.csv", content, "text/csv;charset=utf-8");
	}

	function saveTxt() {
		const content = outcomes.join("\n") + "\n";
		downloadFile("coin_flip_outcomes.txt", content, "text/plain;charset=utf-8");
	}

	document.getElementById("headsButton").addEventListener("click", () => recordOutcome("H"));
	document.getElementById("tailsButton").addEventListener("click", () => recordOutcome("T"));
	document.getElementById("resetButton").addEventListener("click", resetOutcomes);
	document.getElementById("saveCsvButton").addEventListener("click", saveCsv);
	document.getElementById("saveTxtButton").addEventListener("click", saveTxt);

	updateDisplay();
</script>
</body>
</html>
